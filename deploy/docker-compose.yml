services:
  postgres:
    image: postgres:15-alpine
    container_name: funcionalinox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: funcionalinox
      POSTGRES_USER: funcional
      POSTGRES_PASSWORD: funcional
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
